<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("carumds-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
            return;
          }
        } catch (e) {}
        var m = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.setAttribute("data-theme", m ? "light" : "dark");
        document.documentElement.style.colorScheme = m ? "light" : "dark";
      })();
    </script>
    <title>Iniciar sessão — Painel Admin</title>
    <link rel="stylesheet" href="../css/design-tokens.css" />
    <link rel="stylesheet" href="../css/core-components.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="css/prototype-login.css" />
  </head>
  <body class="proto-login">
    <aside class="proto-login__brand" aria-hidden="false">
      <div class="proto-login__brand-inner">
        <div class="proto-login__logo-mark" aria-hidden="true">C</div>
        <h1 class="proto-login__brand-title">Painel Admin</h1>
        <p class="proto-login__brand-sub">
          Gestão centralizada. Protótipo visual com o design system carumds — sem validação de formulário.
        </p>
      </div>
    </aside>

    <div class="proto-login__main">
      <div class="proto-login__card">
        <div class="proto-login__card-tools">
          <button type="button" class="md-icon-btn" id="md-theme-toggle" aria-pressed="false" aria-label="Alternar tema claro ou escuro" title="Tema">
            <span class="ms">light_mode</span>
          </button>
        </div>
        <header class="proto-login__card-head">
          <p class="proto-login__card-eyebrow">Acesso reservado</p>
          <h2 class="proto-login__card-title">Iniciar sessão</h2>
          <p class="proto-login__card-desc">Introduza as credenciais da sua conta para continuar.</p>
        </header>

        <form class="proto-login__form" action="#" method="post" novalidate>
          <div class="proto-login__field">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              name="email"
              type="email"
              class="cc-input"
              placeholder="nome@empresa.pt"
              autocomplete="username"
            />
          </div>

          <div class="proto-login__field">
            <label for="login-password">Palavra-passe</label>
            <input
              id="login-password"
              name="password"
              type="password"
              class="cc-input"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>

          <div class="proto-login__row">
            <label class="cc-check">
              <input type="checkbox" name="remember" checked />
              Manter sessão iniciada
            </label>
            <button type="button" class="proto-login__link">Esqueceu-se da palavra-passe?</button>
          </div>

          <button type="submit" class="btn btn--md btn--primary btn--solid proto-login__submit">Entrar</button>
        </form>

        <p class="proto-login__footer">Carum DS · protótipo Painel Admin</p>
      </div>
    </div>

    <script src="../js/theme.js"></script>
    <script>
      document.querySelector(".proto-login__form").addEventListener("submit", function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
