<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Painel Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Carum - DS - GitHub/css/design-tokens.css" />
    <link rel="stylesheet" href="../Carum - DS - GitHub/css/theme.css" />
    <link rel="stylesheet" href="../Carum - DS - GitHub/css/core-components.css" />
    <link rel="stylesheet" href="../Carum - DS - GitHub/css/components.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <div class="login">
      <aside class="login__hero" aria-hidden="true">
        <div class="login__hero-bg"></div>
        <svg
          class="login__hero-art"
          viewBox="0 0 800 900"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.95" />
              <stop offset="45%" stop-color="#448aff" stop-opacity="0.85" />
              <stop offset="100%" stop-color="#ff9100" stop-opacity="0.9" />
            </linearGradient>
            <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#e040fb" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#00b0ff" stop-opacity="0.5" />
            </linearGradient>
            <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="32" />
            </filter>
          </defs>
          <ellipse cx="220" cy="280" rx="200" ry="180" fill="url(#g2)" filter="url(#blur)" opacity="0.75" />
          <ellipse cx="520" cy="420" rx="260" ry="220" fill="url(#g1)" filter="url(#blur)" opacity="0.65" />
          <path
            d="M120 520 Q380 380 640 560 T760 200"
            fill="none"
            stroke="url(#g1)"
            stroke-width="3"
            stroke-linecap="round"
            opacity="0.55"
          />
          <path
            d="M80 360 Q280 200 480 340 Q640 460 720 300"
            fill="none"
            stroke="rgba(255,255,255,0.35)"
            stroke-width="2"
            stroke-linecap="round"
          />
          <circle cx="400" cy="480" r="6" fill="#ff9100" opacity="0.9" />
          <circle cx="310" cy="380" r="4" fill="#7c4dff" opacity="0.85" />
          <circle cx="560" cy="340" r="5" fill="#00e5ff" opacity="0.75" />
        </svg>
      </aside>

      <main class="login__main">
        <div class="login__shell">
          <header class="login__header">
            <div class="login__logo" lang="en">
              <span class="login__logo-text">carum</span>
              <span class="login__logo-dot" aria-hidden="true"></span>
            </div>
            <h1 class="login__title">Acesse sua conta</h1>
            <p class="login__subtitle">Preencha seus dados para entrar no painel.</p>
          </header>

          <form class="login__form" action="#" method="post">
            <div class="login__field">
              <label class="login__label" for="email">E-mail</label>
              <input
                id="email"
                name="email"
                type="email"
                class="cc-input login__input"
                placeholder="Seu e-mail"
                autocomplete="username"
              />
            </div>

            <div class="login__field">
              <label class="login__label" for="password">Senha</label>
              <div class="login__password-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="cc-input login__input"
                  placeholder="Sua senha"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="login__toggle-pw"
                  aria-label="Mostrar ou ocultar senha"
                  id="togglePw"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M12 5c-5 0-9.27 3.11-10 7 .73 3.89 5 7 10 7s9.27-3.11 10-7c-.73-3.89-5-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="login__row">
              <a class="login__link" href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="login__submit">Fazer Login</button>
          </form>

          <p class="login__footer">
            Não tem uma conta?
            <a class="login__link login__link--inline" href="#">Cadastre-se</a>
          </p>
        </div>
      </main>
    </div>

    <script>
      (function () {
        var input = document.getElementById("password");
        var btn = document.getElementById("togglePw");
        if (!input || !btn) return;
        btn.addEventListener("click", function () {
          input.type = input.type === "password" ? "text" : "password";
        });
      })();
    </script>
  </body>
</html>
