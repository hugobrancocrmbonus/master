<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ds/css/design-tokens.css" />
    <link rel="stylesheet" href="ds/css/theme.css" />
    <link rel="stylesheet" href="ds/css/core-components.css" />
    <link rel="stylesheet" href="ds/css/components.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <div class="login">
      <aside class="login__brand" aria-label="Marca">
        <div class="login__brand-card">
          <img
            class="login__brand-logo-img"
            src="assets/CRMBonus%20Logotipo.svg"
            alt="CRMBonus"
          />
        </div>
      </aside>

      <main class="login__main">
        <div class="login__shell">
          <header class="login__header">
            <h1 class="login__title">Boas-vindas ao Master!</h1>
            <p class="login__subtitle">
              Por aqui, você pode transformar dados em decisões estratégicas e acompanhar os resultados de
              cada cliente.
            </p>
          </header>

          <form class="login__form" action="home.html" method="get">
            <div class="login__field">
              <label class="login__label" for="login">Login</label>
              <input
                id="login"
                name="login"
                type="text"
                class="cc-input login__input"
                autocomplete="username"
              />
            </div>

            <div class="login__field">
              <label class="login__label" for="password">Senha</label>
              <input
                id="password"
                name="password"
                type="password"
                class="cc-input login__input"
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="btn btn--primary btn--solid btn--md login__btn-block">
              Fazer Login
            </button>

            <div class="login__divider" role="separator">
              <span>ou</span>
            </div>

            <button type="button" class="btn btn--primary btn--outline btn--md login__btn-block">
              Entrar com CyberArk
            </button>
          </form>

          <p class="login__help">
            Problemas para entrar?
            <a class="login__help-link" href="#">Solicitar suporte</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
