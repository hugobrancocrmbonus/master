<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ds/css/design-tokens.css" />
    <link rel="stylesheet" href="ds/css/theme.css" />
    <link rel="stylesheet" href="ds/css/core-components.css" />
    <link rel="stylesheet" href="ds/css/components.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <div class="login">
      <aside class="login__brand" aria-label="Marca">
        <div class="login__brand-card">
          <div class="login__brand-logo" lang="en">
            <span class="login__brand-name">crmbonus</span>
            <svg
              class="login__brand-mark"
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M5 19L19 5M19 5H9M19 5V15"
                stroke="var(--crm-bg-regular-primary-enabled)"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="login__brand-deco" aria-hidden="true">
            <svg class="login__arrows" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="arr-g" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#fc5140" />
                  <stop offset="100%" stop-color="#fda92b" />
                </linearGradient>
              </defs>
              <path
                d="M20 170 L55 135 L48 128 L85 95 L78 88 L120 52"
                stroke="url(#arr-g)"
                stroke-width="3"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.95"
              />
              <path
                d="M45 175 L95 128 L88 120 L140 78"
                stroke="url(#arr-g)"
                stroke-width="2.5"
                fill="none"
                stroke-linecap="round"
                opacity="0.85"
              />
              <path
                d="M75 185 L130 138 L122 130 L175 88 L168 82 L210 48"
                stroke="url(#arr-g)"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                opacity="0.75"
              />
              <path
                d="M8 155 L42 125 L36 118 L70 88"
                stroke="#fda92b"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                opacity="0.9"
              />
            </svg>
          </div>
        </div>
      </aside>

      <main class="login__main">
        <div class="login__shell">
          <header class="login__header">
            <h1 class="login__title">Boas-vindas ao Master!</h1>
            <p class="login__subtitle">
              Por aqui, você pode transformar dados em decisões estratégicas e acompanhar os resultados de
              cada cliente.
            </p>
          </header>

          <form class="login__form" action="#" method="post">
            <div class="login__field">
              <label class="login__label" for="login">Login</label>
              <input
                id="login"
                name="login"
                type="text"
                class="cc-input login__input"
                autocomplete="username"
              />
            </div>

            <div class="login__field">
              <label class="login__label" for="password">Senha</label>
              <input
                id="password"
                name="password"
                type="password"
                class="cc-input login__input"
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="btn btn--primary btn--solid btn--md login__btn-block">
              Fazer Login
            </button>

            <div class="login__divider" role="separator">
              <span>ou</span>
            </div>

            <button type="button" class="btn btn--primary btn--outline btn--md login__btn-block">
              Entrar com CyberArk
            </button>
          </form>

          <p class="login__help">
            Problemas para entrar?
            <a class="login__help-link" href="#">Solicitar suporte</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
