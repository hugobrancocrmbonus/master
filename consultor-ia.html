      <div class="app-main">
        <header class="app-header" id="appHeader" data-state="default" data-page="consultor">
          <div class="app-header__nav-left">
            <div class="app-header__title-block" id="headerLeftDefault" hidden>
              <h1 class="app-header__page-title">Consultor IA</h1>
            </div>
            <nav class="app-header__breadcrumb" id="headerLeftApplied" aria-label="Localização na aplicação">
              <a href="home.html" class="app-header__crumb app-header__crumb--weak app-header__crumb-link">Página inicial</a>
              <span class="app-header__crumb-sep" aria-hidden="true">/</span>
              <span class="app-header__crumb app-header__crumb--strong" aria-current="page">Consultor IA</span>
            </nav>
          </div>
          <div class="app-header__actions">
            <div class="app-header__brand-chip" id="headerBrandChip">
              <button type="button" class="app-header__select-link js-open-brand-drawer" id="headerLinkSelectBrand">
                Selecionar marca
              </button>
              <div class="app-header__brand-applied" id="headerBrandApplied" hidden>
                <div class="app-header__brand-logo-wrap">
                  <img class="app-header__brand-logo" id="headerBrandLogo" src="" alt="" />
                </div>
                <span class="app-header__brand-name" id="headerBrandName"></span>
                <span class="app-header__brand-divider" aria-hidden="true"></span>
                <button type="button" class="app-header__swap-brand js-open-brand-drawer" id="headerBtnSwapBrand">
                  Trocar marca
                </button>
              </div>
            </div>
            <div class="app-header__icon-wrap">
              <button type="button" class="app-header__icon-btn" aria-label="Notificações">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5L4 18h16l-2-2z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="app-header__badge" aria-hidden="true"></span>
              </button>
            </div>
            <div class="app-header__icon-wrap" id="headerIconMessages" hidden>
              <button type="button" class="app-header__icon-btn" aria-label="Mensagens">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M4 6h16v10H8l-4 3V6z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="app-header__badge" aria-hidden="true"></span>
              </button>
            </div>
            <div class="app-header__user" role="button" tabindex="0" aria-label="Conta">
              <img
                class="app-header__avatar"
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Ccircle cx='36' cy='36' r='36' fill='%2358656f'/%3E%3Ccircle cx='36' cy='30' r='12' fill='%23eef0f2'/%3E%3Cpath d='M12 62c4-14 12-20 24-20s20 6 24 20' fill='%23eef0f2'/%3E%3C/svg%3E"
                width="40"
                height="40"
                alt=""
              />

                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </header>

        <main class="app-content app-content--ia">
          <div class="ia-chat" id="iaChat">
            <div class="ia-chat__panel">
              <div class="ia-chat__hero" id="iaHero">
                <h2 class="ia-chat__title">O que você precisa saber sobre o cliente?</h2>
                <p class="ia-chat__subtitle">
                  Utilize nossa IA e peça insights, próximos passos, análise dos números, etc.
                </p>
              </div>

              <div class="ia-chat__thread" id="iaThread" role="log" aria-live="polite" aria-relevant="additions" hidden></div>

              <div class="ia-chat__composer">
                <div class="ia-chat__input-shell">
                  <label class="visually-hidden" for="iaInput">Mensagem para o Consultor IA</label>
                  <textarea
                    id="iaInput"
                    class="ia-chat__textarea"
                    rows="3"
                    placeholder="Pergunte algo sobre o cliente"
                    autocomplete="off"
                  ></textarea>
                  <button type="button" class="ia-chat__send" id="iaSend" disabled aria-disabled="true">
                    Enviar
                  </button>
                </div>

                <div class="ia-chat__suggestions" id="iaSuggestions" role="group" aria-label="Sugestões de perguntas">
                  <button type="button" class="ia-chat__chip" data-ia-prompt="Qual é a receita incremental atual?">
                    Qual é a receita incremental atual?
                  </button>
                  <button type="button" class="ia-chat__chip" data-ia-prompt="Qual é o módulo mais indicado?">
                    Qual é o módulo mais indicado?
                  </button>
                  <button type="button" class="ia-chat__chip" data-ia-prompt="Quais são os próximos passos?">
                    Quais são os próximos passos?
                  </button>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="app-scrim" id="brandScrim" hidden></div>
    <aside
      class="app-brand-drawer"
      id="brandDrawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="brandDrawerTitle"
      aria-hidden="true"
    >
      <div class="app-brand-drawer__header">
        <h2 class="app-brand-drawer__title" id="brandDrawerTitle">Selecionar marca</h2>
        <button type="button" class="app-brand-drawer__close" id="closeBrandDrawer" aria-label="Fechar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6l12 12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="app-brand-drawer__controls">
        <div class="app-brand-drawer__search">
          <input
            type="search"
            class="app-brand-drawer__search-input"
            id="brandSearchInput"
            placeholder="Busque por marca"
            autocomplete="off"
            aria-label="Busque por marca"
          />
          <button type="button" class="app-brand-drawer__search-btn" aria-label="Buscar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
              <path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="app-brand-drawer__tabs" role="tablist" aria-label="Filtrar marcas">
          <button
            type="button"
            class="app-brand-drawer__tab is-active"
            id="tabMine"
            role="tab"
            aria-selected="true"
            aria-controls="brandDrawerPanel"
          >
            Minhas marcas
          </button>
          <button
            type="button"
            class="app-brand-drawer__tab"
            id="tabAll"
            role="tab"
            aria-selected="false"
            aria-controls="brandDrawerPanel"
          >
            Todas as marcas
          </button>
        </div>
      </div>

          <li>
            <button type="button" class="app-brand-drawer__card" data-brand="samsung">

            id="confirmBrandDrawer"

    <script src="js/home.js"></script>
    <script src="js/consultor-ia.js"></script>
